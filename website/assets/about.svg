<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-label="AB Rentals illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f0fe"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#1a5fcc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="460" fill="url(#sky)"/>
  <circle cx="500" cy="90" r="44" fill="#ff8a3d" opacity="0.85"/>
  <!-- ground -->
  <rect x="0" y="380" width="600" height="80" fill="#dde6f2"/>
  <!-- house 1 -->
  <g>
    <rect x="90" y="220" width="200" height="160" rx="6" fill="#ffffff" stroke="#e6eaf0"/>
    <polygon points="80,222 190,140 300,222" fill="url(#roof)"/>
    <rect x="120" y="270" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#1f6feb"/>
    <rect x="210" y="270" width="50" height="110" rx="4" fill="#1f6feb"/>
    <circle cx="248" cy="325" r="4" fill="#ffd27a"/>
  </g>
  <!-- house 2 -->
  <g>
    <rect x="320" y="250" width="190" height="130" rx="6" fill="#ffffff" stroke="#e6eaf0"/>
    <polygon points="312,252 415,185 518,252" fill="#ff8a3d"/>
    <rect x="345" y="290" width="46" height="46" rx="4" fill="#fff3e8" stroke="#ff8a3d"/>
    <rect x="440" y="290" width="46" height="90" rx="4" fill="#ff8a3d"/>
  </g>
  <!-- key icon badge -->
  <g transform="translate(255,330)">
    <circle cx="0" cy="0" r="34" fill="#1f6feb"/>
    <circle cx="-6" cy="-4" r="8" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M0 0 L16 16 M11 11 L17 5 M6 16 L12 10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
